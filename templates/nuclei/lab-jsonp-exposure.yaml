id: sentinel-lab-jsonp-exposure

info:
  name: Sentinel Lab JSONP 敏感信息泄露
  author: sentinel
  severity: medium
  description: 靶场 /api/jsonp 回显用户令牌, 存在 JSONP 劫持风险
  tags: jsonp,exposure,lab

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/jsonp?callback=cb"
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        part: body
        words:
          - "sentinel-jsonp-token"
